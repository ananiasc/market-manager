<!-- Header -->
<header class="flex items-center justify-between p-4 bg-white shadow">
  <div class="flex items-center space-x-4">
    <h1 class="text-xl font-semibold">Portal Market</h1>
  </div>
  <!-- Seção de busca e ícones -->
  <div class="flex items-center space-x-4">
    <input type="text" placeholder="Search.." class="px-3 py-2 text-sm border rounded-md focus:outline-none focus:ring-2 focus:ring-gray-300">
    <div class="flex space-x-2">
      <!-- Ícones adicionais -->
      <button class="p-2 text-gray-600 rounded-full focus:outline-none focus:ring-2 focus:ring-gray-500">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
        </svg>
      </button>
    </div>
  </div>
</header>
