<div class="flex h-screen">
  <!-- Menu Lateral -->
  <aside class="w-64 bg-white shadow-lg">
    <!-- Avatar e Nome -->
    <div class="p-4 text-center">
      <img [src]="img.userAvatar" class="mx-auto rounded-full w-16" alt="User Avatar">
      <h3 class="mt-2 text-lg font-semibold">John</h3>
      <p class="text-sm text-gray-500">General Manager</p>
    </div>

    <!-- Menu Principal -->
    <nav class="mt-6">
      <ul class="space-y-2">
        <li class="px-4 py-2 hover:bg-gray-100">
          <button (click)="toggleMenu('catalogo')" class="flex items-center justify-between w-full text-gray-700">
            <span class="flex items-center">
              <span class="material-icons-outlined">
                <img [src]="img.catalog" class="w-6">
              </span>
              <span class="ml-2">Catálogo</span>
            </span>
            <span class="material-icons-outlined">
              <img [src]="img.toggleCatalog" class="w-6">
            </span>
          </button>
          
          <ul *ngIf="isCatalogOpen" class="mt-2 ml-4 space-y-1 text-sm">
            <li class="py-1 hover:bg-gray-100">
              <a href="#" class="flex items-center">
                <span class="material-icons-outlined">
                  <img [src]="img.products" class="w-6">
                </span>
                <span class="ml-2">Produtos</span>
              </a>
            </li>

            <li class="py-1 hover:bg-gray-100">
              <a href="#" class="flex items-center">
                <span class="material-icons-outlined">
                  <img [src]="img.brands" class="w-6">
                </span>
                <span class="ml-2">Marcas</span>
              </a>
            </li>

            <li class="py-1 hover:bg-gray-100">
              <a href="#" class="flex items-center">
                <span class="material-icons-outlined">
                  <img [src]="img.categories" class="w-6">
                </span>
                <span class="ml-2">Categorias</span>
              </a>
            </li>
          </ul>
        </li>

        <li class="px-4 py-2 hover:bg-gray-100">
          <a href="#" class="flex items-center text-gray-700">
            <img [src]="img.setting" class="w-6">
            <span class="ml-2">Promoções</span>
          </a>
        </li>

        <li class="px-4 py-2 hover:bg-gray-100">
          <a href="#" class="flex items-center text-gray-700">
            <img [src]="img.users" class="w-6">
            <span class="ml-2">Usuários</span>
          </a>
        </li>

        <li class="px-4 py-2 hover:bg-gray-100">
          <a href="#" class="flex items-center text-gray-700">
            <img [src]="img.clients" class="w-6">
            <span class="ml-2">Clientes</span>
          </a>
        </li>

        <li class="px-4 py-2 hover:bg-gray-100">
          <a href="#" class="flex items-center text-gray-700">
            <img [src]="img.sales" class="w-6">
            <span class="ml-2">Vendas</span>
          </a>
        </li>

        <li class="px-4 py-2 hover:bg-gray-100">
          <a href="#" class="flex items-center text-gray-700">
            <img [src]="img.setting" class="w-6">
            <span class="ml-2">Configurações</span>
          </a>
        </li>
      </ul>
    </nav>
  </aside>


  <!-- Conteúdo Principal -->
  <main class="flex-1 bg-gray-50">
    <!-- Header -->
    <header class="flex items-center justify-between p-4 bg-white shadow">
      <div class="flex items-center space-x-4">
        <button class="p-2 text-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-gray-500">
          <!-- Icone de Menu -->
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path>
          </svg>
        </button>
        <h1 class="text-xl font-semibold">Painel</h1>
      </div>
      <!-- Seção de busca e ícones -->
      <div class="flex items-center space-x-4">
        <input type="text" placeholder="Search.." class="px-3 py-2 text-sm border rounded-md focus:outline-none focus:ring-2 focus:ring-gray-300">
        <div class="flex space-x-2">
          <!-- Ícones adicionais -->
          <button class="p-2 text-gray-600 rounded-full focus:outline-none focus:ring-2 focus:ring-gray-500">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <!-- Boxes de Informação -->
    <div class="p-4 space-y-4">
      <div class="grid grid-cols-1 gap-4 md:grid-cols-4">
        <div class="p-4 bg-orange-100 rounded-lg shadow">
          <h2 class="text-lg font-semibold">Ganhos</h2>
          <p class="text-2xl font-bold">R$ 6659 Esse mês</p>
        </div>
        <div class="p-4 bg-teal-100 rounded-lg shadow">
          <h2 class="text-lg font-semibold">Produtos</h2>
          <p class="text-2xl font-bold">R$ 9856 Esse mês</p>
        </div>
        <div class="p-4 bg-pink-100 rounded-lg shadow">
          <h2 class="text-lg font-semibold">Mensagens</h2>
          <p class="text-2xl font-bold">R$ 893 Esse mês</p>
        </div>
        <div class="p-4 bg-gray-100 rounded-lg shadow">
          <h2 class="text-lg font-semibold">Novas vendas</h2>
          <p class="text-2xl font-bold">R$ 45631 Esse mês</p>
        </div>
      </div>
    </div>
  </main>
</div>
